name: Produktaufgabe
description: Eine konkrete, überprüfbare Einheit Sovinity-Arbeit planen
projects:
  - sovinityAI/1
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation und Mehrwert
      description: Welches heutige Problem oder welche Chance adressiert das Issue, wer oder was profitiert und was verbessert sich nach dem Abschluss für Nutzende, Produkt, Betrieb oder Zusammenarbeit?
      placeholder: Beschreibe die gewünschte Wirkung. Belastbare qualitative Aussagen genügen; erfinde keine Kennzahlen.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Zielzustand
      description: Welcher konkrete Zustand muss erreicht sein, damit dieses Issue abgeschlossen werden kann?
      placeholder: Beschreibe, was nach dem Abschluss wahr ist, ohne bereits die einzelnen Akzeptanzkriterien aufzuzählen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext und Nachweise
      description: Welche Ausgangslage, früheren Entscheidungen oder belastbaren Nachweise sind für die Umsetzung relevant?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: Verwende eine prüfbare Liste. Jeder Eintrag muss unabhängig verifizierbar sein.
      placeholder: |
        - [ ] Kriterium eins
        - [ ] Kriterium zwei
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Abhängigkeiten und Blocker
      description: Verknüpfe blockierende oder blockierte Issues. Schreibe „Keine bekannt“, falls nichts bekannt ist.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Verifikation
      description: Welche Tests, Prüfungen oder Artefakte weisen den Abschluss nach?
    validations:
      required: true
  - type: dropdown
    id: work_type
    attributes:
      label: Arbeitsart
      description: Diese Auswahl beschreibt die geeignete Ausführung; sie weist das Issue niemandem zu.
      options:
        - "Alle Mitwirkenden"
        - "KI-geeignet"
        - "Menschliche Entscheidung"
        - "Gemeinsame Arbeit"
        - "Extern"
    validations:
      required: true
  - type: dropdown
    id: ready_to_start
    attributes:
      label: Bereit zur Übernahme durch einen Menschen oder KI-Agenten?
      description: Ein Issue in Bereit bleibt unzugewiesen, bis Mitwirkende mit freier Kapazität es übernehmen.
      options:
        - "Nein — Produktentscheidung, Abhängigkeit oder Input fehlt noch"
        - "Ja — Mehrwert, Scope, Akzeptanzkriterien und Abhängigkeiten sind ausreichend"
    validations:
      required: true
