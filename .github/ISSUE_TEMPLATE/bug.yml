name: Fehlerbericht
description: Einen reproduzierbaren Fehler in Sovinity melden
labels:
  - bug
projects:
  - sovinityAI/1
body:
  - type: textarea
    id: observed
    attributes:
      label: Beobachtetes Verhalten
      description: Was ist geschehen? Nenne die genaue Fehlermeldung, falls sie verfügbar ist.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was hätte stattdessen geschehen sollen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. Beginne bei ...
        2. Führe ... aus
        3. Beobachte ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Auswirkung und betroffene Nutzende
      description: Beschreibe die Schwere, ohne private Nutzerdaten anzugeben.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      placeholder: |
        - [ ] Der Fehler ist durch einen Regressionstest abgedeckt
        - [ ] Die relevante Testsuite ist erfolgreich
    validations:
      required: true
  - type: textarea
    id: safe_evidence
    attributes:
      label: Sichere Diagnosenachweise
      description: Füge nur bereinigte Logs oder Screenshots hinzu. Niemals Zugangsdaten, persönliche Dokumente oder Produktionsdaten angeben.
